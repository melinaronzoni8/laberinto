<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberinto Brutalista 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <h1>LABERINTO MECÁNICO</h1>
            <p>Hacé clic para entrar</p>
            <div class="keys">
                <span><b>W A S D</b> o <b>Flechas</b>: Caminar</span>
                <span><b>Mouse</b>: Mirar alrededor</span>
                <span><b>ESPACIO / SHIFT</b>: Subir / Bajar altura</span>
                <span><b>ESC</b>: Pausar / Liberar cursor</span>
            </div>
        </div>
    </div>

    <div id="crosshair">+</div>

    <script type="module" src="js/scene.js"></script>
</body>
</html>
